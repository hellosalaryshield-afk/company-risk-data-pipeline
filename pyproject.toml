[project]
name = "company-risk-data-pipeline"
version = "0.1.0"
description = "Data collection backend for company layoff-risk research."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116.0",
    "uvicorn[standard]>=0.35.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.16.0",
    "httpx>=0.28.0",
    "jinja2>=3.1.0",
    "xhtml2pdf>=0.2.16",
    "trafilatura>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
]
# Reading the company taxonomy spreadsheet (scripts/clean_company_directory.py). Not needed by the server.
directory = [
    "openpyxl>=3.1.0",
]
observability = [
    "logfire[fastapi,httpx,sqlalchemy]>=5.4.0",
]
scorecard = [
    "playwright==1.65.0",  # must match the Docker image tag, which ships the matching Chromium
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.package-data]
"app.reports" = ["templates/*.html"]
"app.scoring" = ["*.json"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "data*", "docs*", "scripts*", "tests*"]
